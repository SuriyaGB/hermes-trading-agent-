name: Deploy Backend to VPS (Manual Only)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            # Navigate to project directory
            cd /root/hermes-trading-agent-

            # Pull latest code
            git pull origin main

            # Activate virtual environment
            source .venv/bin/activate

            # Install dependencies
            pip install -r requirements.txt

            # Give execute permission
            chmod +x scripts/*.sh
            # Restart backend
            pm2 restart all || echo "PM2 restart failed"

            # Setup the USA Market Hours automated cron jobs (Disabled for safety, run manually if needed)
            # bash scripts/setup_cron.sh
