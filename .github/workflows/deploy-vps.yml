name: Deploy Backend to VPS (Manual Only)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            # Exit immediately if any command fails (Guarantees RED TICK ❌ if deployment fails!)
            set -e

            # Navigate to project directory
            cd /root/hermes-trading-agent-

            # 1. 100% BULLETPROOF SAFETY GUARANTEE: Backup entire 30-day live data folder before Git touches anything!
            mkdir -p /root/hermes_data_backups
            cp -r /root/hermes-trading-agent-/data /root/hermes_data_backups/data_backup_$(date +"%Y%m%d_%H%M%S")

            # 2. Clean, Simple, Professional Pull (No autostash hacks or blind hard resets!)
            # If any local code difference exists, set -e will catch it and alert you with a RED TICK ❌!
            git pull origin main

            # Activate virtual environment
            source .venv/bin/activate

            # Install dependencies
            pip install -r requirements.txt

            # Give execute permission
            chmod +x scripts/*.sh
            # Restart backend
            pm2 restart all || echo "PM2 restart failed"

            # Setup the USA Market Hours automated cron jobs (Disabled for safety, run manually if needed)
            # bash scripts/setup_cron.sh
